# Checks the development branch (AF-009): every push to it and every pull
# request into it. Runs the frontend's types, lint and tests, and the
# backend's types and tests. Nothing here needs a GPU, a database or a
# network service: the tests fake all three.
name: CI

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

jobs:
  frontend:
    runs-on: ubuntu-latest
    # The suite builds whole universes and runs their world histories: minutes
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The lockfile was written by npm 11; Node 22's own npm 10 reads its optional packages as missing
      - run: npm install -g npm@11.6.1
      - run: npm ci
      - name: Typecheck
        run: npx tsc -b
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # The lockfile was written by npm 11; Node 22's own npm 10 reads its optional packages as missing
      - run: npm install -g npm@11.6.1
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
